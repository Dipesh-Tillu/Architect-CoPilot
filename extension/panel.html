<!doctype html>
<meta charset="utf-8">
<title>Architect Copilot</title>
<style>
  body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;padding:12px;margin:0}
  #ctx{font-size:12px;color:#444;max-height:120px;overflow:auto;border:1px solid #eee;border-radius:8px;padding:8px}
  #ask{width:100%;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid #ccc;margin:8px 0}
  #go{padding:8px 12px;border:0;border-radius:8px;background:#205ad6;color:#fff;cursor:pointer}
  #out{margin-top:12px}
  pre{white-space:pre-wrap;word-wrap:break-word;background:#fafafa;border:1px solid #eee;border-radius:8px;padding:8px}
  .row{display:flex;gap:8px}
  .col{flex:1}
  .sec{margin-top:12px}
</style>
<div class="sec">
  <div class="row">
    <input id="ask" placeholder="Ask for an architecture, tradeoff, or what-if..." />
    <button id="go">Generate</button>
  </div>
  <div id="ctx"></div>
</div>
<div id="out" class="sec"></div>
<script src="panel.js"></script>
