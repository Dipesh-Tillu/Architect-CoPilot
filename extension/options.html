<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Architect Copilot Options</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; padding: 16px; }
    label { display: block; margin: 8px 0 4px; }
    input[type=text], input[type=number] { width: 420px; padding: 6px; }
  </style>
</head>
<body>
  <h1>Options</h1>
  <label>Backend URL</label>
  <input id="backend" type="text" placeholder="http://127.0.0.1:8000" />
  <label>Token budget per hour</label>
  <input id="budget" type="number" placeholder="100000" />
  <button id="save">Save</button>
  <script src="options.js"></script>
</body>
</html>
